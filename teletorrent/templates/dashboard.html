<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TeleTorrent</title><style>
:root{color-scheme:dark}body{font-family:system-ui;margin:0;background:#0b1020;color:#e8ecf4}.wrap{max-width:1200px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#151c30;border:1px solid #27304b;border-radius:14px;padding:16px;margin-bottom:14px}h1,h2{margin-top:0}.big{font-size:1.5rem;font-weight:700}.muted{color:#9da8bf}.row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;padding:10px 0;border-bottom:1px solid #27304b}.bar{height:8px;background:#303a55;border-radius:9px;overflow:hidden}.fill{height:100%;background:#78dba9}code{word-break:break-all}@media(max-width:700px){.row{grid-template-columns:1fr}.hide-mobile{display:none}}</style></head><body><div class="wrap"><h1>🛡️ TeleTorrent</h1><div id="health" class="muted">Loading…</div><div class="grid" id="metrics"></div><div class="card"><h2>Torrents</h2><div id="torrents"></div></div><div class="card"><h2>Security pipeline</h2><div id="jobs"></div></div><div class="card"><h2>Events</h2><div id="events"></div></div></div><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function refresh(){let r=await fetch('/api/status'),d=await r.json();document.querySelector('#health').textContent=d.qbit_ok?'qBittorrent connected · auto-refresh 10s':'qBittorrent error: '+d.error;document.querySelector('#metrics').innerHTML=[['CPU',d.cpu+'%'],['Memory',d.memory+'%'],['Temperature',d.temp?d.temp+'°C':'n/a'],['Disk',d.disk.percent+'%'],['Download',d.transfer.down||'n/a'],['Upload',d.transfer.up||'n/a']].map(x=>`<div class=card><div class=muted>${x[0]}</div><div class=big>${x[1]}</div></div>`).join('');document.querySelector('#torrents').innerHTML=d.torrents.length?d.torrents.map(t=>`<div class=row><div><b>${esc(t.name)}</b><div class=bar><div class=fill style="width:${t.progress}%"></div></div></div><div>${t.progress}%</div><div>${esc(t.state)}</div><div>↓ ${t.dlspeed}<br>↑ ${t.upspeed}</div></div>`).join(''):'No torrents';document.querySelector('#jobs').innerHTML=d.jobs.map(j=>`<div class=row><div><b>${esc(j.name)}</b></div><div>${esc(j.status)}</div><div class=hide-mobile>${esc(j.updated_at)}</div><div>${esc(j.malware||'')}</div></div>`).join('');document.querySelector('#events').innerHTML=d.events.map(e=>`<div><small>${esc(e.ts)}</small> <b>${esc(e.level)}</b> ${esc(e.message)}</div>`).join('')}refresh();setInterval(refresh,10000);</script></body></html>
